<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tier List App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tier List">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf9f6;--sur:#fff;--sur2:#f3f1ec;--sur3:#e8e5de;
  --bdr:rgba(0,0,0,.10);--bdrm:rgba(0,0,0,.18);
  --tx:#1a1a18;--tx2:#666660;--tx3:#999993;
  --r:10px;--rl:14px;
  --s-bg:#FAEEDA;--s-bd:#BA7517;--s-tx:#633806;
  --a-bg:#EAF3DE;--a-bd:#3B6D11;--a-tx:#27500A;
  --b-bg:#E6F1FB;--b-bd:#185FA5;--b-tx:#0C447C;
  --c-bg:#F1EFE8;--c-bd:#888780;--c-tx:#444441;
  --d-bg:#FAECE7;--d-bd:#993C1D;--d-tx:#712B13;
  --f-bg:#FCEBEB;--f-bd:#A32D2D;--f-tx:#791F1F;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1b18;--sur:#252420;--sur2:#2e2c28;--sur3:#383530;
  --bdr:rgba(255,255,255,.09);--bdrm:rgba(255,255,255,.16);
  --tx:#f0ede6;--tx2:#a09d96;--tx3:#6b6864;
  --s-bg:#3a2800;--s-bd:#BA7517;--s-tx:#FAC775;
  --a-bg:#192800;--a-bd:#3B6D11;--a-tx:#C0DD97;
  --b-bg:#001830;--b-bd:#185FA5;--b-tx:#85B7EB;
  --c-bg:#252420;--c-bd:#888780;--c-tx:#B4B2A9;
  --d-bg:#2a1200;--d-bd:#993C1D;--d-tx:#F0997B;
  --f-bg:#280000;--f-bd:#A32D2D;--f-tx:#F09595;
}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}

.screen{display:none;flex-direction:column;min-height:100vh}
.screen.on{display:flex}

/* TOP BAR */
.topbar{background:var(--sur);border-bottom:1px solid var(--bdr);padding:12px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.topbar-title{font-size:16px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.topbar-sub{font-size:11px;color:var(--tx3);margin-top:1px}
.tbk{padding:6px 12px;font-size:13px;font-weight:500;border-radius:99px;border:1px solid var(--bdrm);background:var(--sur2);color:var(--tx);cursor:pointer;white-space:nowrap;flex-shrink:0}
.tbk:hover{background:var(--sur3)}
.tbk.hi{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.tbk.hi:hover{opacity:.85}
.tbk.sm{padding:5px 10px;font-size:12px}

/* PROGRESS */
.prog-bar{padding:6px 16px 8px;background:var(--sur);border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px;flex-shrink:0}
.prog-track{flex:1;height:4px;background:var(--sur2);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:#BA7517;border-radius:99px;transition:width .3s}
.prog-lbl{font-size:11px;color:var(--tx3);white-space:nowrap}

/* LIST TABS */
.list-tabs{display:flex;gap:4px;padding:10px 16px 0;background:var(--sur);border-bottom:1px solid var(--bdr);flex-shrink:0}
.ltab{padding:6px 14px;font-size:13px;border-radius:8px 8px 0 0;border:1px solid transparent;background:transparent;color:var(--tx2);cursor:pointer}
.ltab.on{background:var(--bg);border-color:var(--bdr);border-bottom-color:var(--bg);color:var(--tx);font-weight:500;margin-bottom:-1px;position:relative;z-index:1}

/* SCROLL */
.scroll{flex:1;overflow-y:auto;padding:16px}

/* CARDS / LIBRARY */
.sec-head{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);margin-bottom:10px}
.pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:24px}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);padding:16px;display:flex;flex-direction:column;gap:10px}
.card.new-card{border-color:var(--b-bd);border-style:dashed}
.card-top{display:flex;gap:10px;align-items:flex-start}
.card-emoji{font-size:26px;line-height:1;flex-shrink:0}
.card-name{font-size:14px;font-weight:500}
.card-sub{font-size:12px;color:var(--tx3);margin-top:2px}
.card-prog-track{height:4px;background:var(--sur2);border-radius:99px;overflow:hidden;margin-bottom:3px}
.card-prog-fill{height:100%;background:#BA7517;border-radius:99px}
.card-prog-lbl{font-size:11px;color:var(--tx3)}
.card-btns{display:flex;gap:5px;flex-wrap:wrap}
.cbtn{padding:6px 12px;font-size:12px;font-weight:500;border-radius:99px;border:1px solid var(--bdrm);background:var(--sur2);color:var(--tx);cursor:pointer;white-space:nowrap}
.cbtn:hover{background:var(--sur3)}
.cbtn.p{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.cbtn.p:hover{opacity:.85}
.cbtn.d{color:var(--f-tx);border-color:var(--f-bd)}
.cbtn.d:hover{background:var(--f-bg)}
.empty-state{text-align:center;padding:24px;background:var(--sur);border:1px dashed var(--bdrm);border-radius:var(--rl);margin-bottom:16px}
.empty-state p{font-size:14px;color:var(--tx2)}

/* INLINE FORM (create/edit list) */
.list-form{background:var(--sur);border:1.5px solid var(--b-bd);border-radius:var(--rl);padding:16px;margin-bottom:16px}
.list-form h3{font-size:14px;font-weight:500;margin-bottom:12px;color:var(--tx)}
.form-row{display:flex;gap:8px;margin-bottom:8px}
.form-emoji{width:64px;padding:8px;font-size:20px;text-align:center;border-radius:var(--r);border:1px solid var(--bdrm);background:var(--sur2);color:var(--tx)}
.form-inp{flex:1;padding:8px 12px;font-size:14px;border-radius:var(--r);border:1px solid var(--bdrm);background:var(--sur2);color:var(--tx);outline:none}
.form-inp::placeholder{color:var(--tx3)}
.form-inp:focus{border-color:var(--b-bd)}
.form-err{font-size:12px;color:var(--f-tx);margin-bottom:8px;min-height:16px}
.form-btns{display:flex;gap:7px}
.form-btn{padding:8px 16px;font-size:13px;font-weight:500;border-radius:99px;border:1px solid var(--bdrm);background:var(--sur2);color:var(--tx);cursor:pointer}
.form-btn:hover{background:var(--sur3)}
.form-btn.p{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.form-btn.p:hover{opacity:.86}

/* TIER ROWS */
.tier-row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.tier-btn{width:58px;min-height:58px;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0;cursor:pointer;border:1px solid;-webkit-tap-highlight-color:transparent}
.tier-btn:disabled{opacity:.4;cursor:default}
.tier-btn:not(:disabled):active{transform:scale(.95)}
.tletter{font-size:19px;font-weight:600;line-height:1}
.tsub{font-size:8px;opacity:.85;text-transform:uppercase;letter-spacing:.04em}
.tier-drop{flex:1;min-height:58px;border:1px solid var(--bdr);border-radius:var(--r);padding:7px;display:flex;flex-wrap:wrap;gap:5px;align-content:center;background:var(--sur)}

/* CHIPS */
.rchip{font-size:12px;padding:3px 4px 3px 9px;border-radius:99px;border:1px solid;display:inline-flex;align-items:center;gap:3px}
.rchip-name{cursor:pointer;-webkit-tap-highlight-color:transparent}
.rchip-name:hover{opacity:.7}
.rchip-del{width:18px;height:18px;border-radius:99px;border:none;background:rgba(0,0,0,.15);color:inherit;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.rchip-del:hover{background:rgba(0,0,0,.3)}
.now-box{margin-top:12px;padding:10px 14px;background:var(--sur);border:1px solid var(--bdrm);border-radius:var(--rl);display:flex;align-items:center;gap:10px}
.now-lbl{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;flex-shrink:0}
.now-name{font-size:15px;font-weight:500;flex:1}
.now-hint{font-size:11px;color:var(--tx3);animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pool-lbl{font-size:11px;color:var(--tx3);margin:14px 0 7px;text-transform:uppercase;letter-spacing:.05em}
.pool{display:flex;flex-wrap:wrap;gap:5px}
.pchip{font-size:12.5px;padding:6px 12px;border-radius:99px;border:1px solid var(--bdrm);background:var(--sur);color:var(--tx);cursor:pointer;-webkit-tap-highlight-color:transparent}
.pchip:hover,.pchip:active{background:var(--sur2)}
.pchip.sel{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:500}
.pchip.cust{border-color:var(--b-bd);color:var(--b-tx);background:var(--b-bg)}
.done-box{text-align:center;padding:24px 0}
.done-box p{font-size:14px;color:var(--tx2);margin-bottom:12px}

/* RESULTS */
.res-row{display:flex;margin-bottom:5px;border-radius:var(--r);overflow:hidden;border:1px solid var(--bdr)}
.res-tier{width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0;flex-shrink:0}
.res-letter{font-size:20px;font-weight:600;line-height:1}
.res-sub{font-size:7.5px;opacity:.8;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.res-chips{flex:1;padding:8px 10px;background:var(--sur);display:flex;flex-wrap:wrap;gap:5px;align-content:center}
.res-chip{font-size:12px;padding:3px 9px;border-radius:99px}
.unrated-note{margin-top:10px;padding:10px 14px;background:var(--sur2);border-radius:var(--r);font-size:12px;color:var(--tx2)}
.save-box{margin-top:20px;padding:16px;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl)}
.save-box h3{font-size:13px;font-weight:500;margin-bottom:6px}
.save-box p{font-size:12px;color:var(--tx2);margin-bottom:9px}
.save-box textarea{width:100%;height:110px;font-size:11px;font-family:monospace;background:var(--sur2);border:1px solid var(--bdr);border-radius:8px;padding:9px;color:var(--tx2);resize:none}

/* MANAGE */
.mcard{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);padding:16px;margin-bottom:12px}
.mcard h3{font-size:14px;font-weight:500;margin-bottom:12px}
.add-row{display:flex;gap:8px}
.add-inp{flex:1;padding:9px 14px;font-size:14px;border-radius:99px;border:1px solid var(--bdrm);background:var(--sur2);color:var(--tx);outline:none}
.add-inp::placeholder{color:var(--tx3)}
.add-go{padding:9px 18px;font-size:13px;font-weight:500;border-radius:99px;border:none;background:var(--tx);color:var(--bg);cursor:pointer;white-space:nowrap}
.add-err{font-size:12px;color:var(--f-tx);margin-top:6px;min-height:16px}
.fl-list{display:flex;flex-direction:column}
.fl-item{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:var(--r)}
.fl-item:hover{background:var(--sur2)}
.fl-name{flex:1;font-size:13px}
.pill{font-size:9px;font-weight:600;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em}
.pill-c{background:var(--b-bg);color:var(--b-tx)}
.pill-r{background:var(--sur2);color:var(--tx3);border:1px solid var(--bdrm)}
.rm-btn{width:26px;height:26px;border-radius:99px;border:1px solid var(--bdrm);background:transparent;color:var(--tx3);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rm-btn:hover{border-color:var(--f-bd);color:var(--f-tx);background:var(--f-bg)}
.sec-lbl{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 5px}
.divider{height:1px;background:var(--bdr);margin:10px 0}

/* SHARED */
.btn-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;padding:8px 16px;font-size:13px;font-weight:500;border-radius:99px;border:1px solid var(--bdrm);background:var(--sur);color:var(--tx);cursor:pointer}
.btn:hover{background:var(--sur2)}
.btn.p{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btn.p:hover{opacity:.86}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a18;color:#f0ede6;padding:10px 18px;border-radius:99px;font-size:13px;transition:transform .3s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.on{transform:translateX(-50%) translateY(0)}

@media(max-width:480px){
  .tbk{padding:5px 9px;font-size:12px}
  .tier-btn{width:50px;min-height:50px}
  .tletter{font-size:16px}
  .pack-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LIBRARY SCREEN -->
<div class="screen on" id="scr-lib">
  <div class="topbar">
    <div style="flex:1;min-width:0">
      <div class="topbar-title">🏆 Tier List</div>
      <div class="topbar-sub">Rate anything, one list at a time</div>
    </div>
    <button class="tbk sm" id="new-list-btn">+ New List</button>
    <label class="tbk sm hi" style="cursor:pointer">
      + Import
      <input type="file" accept=".json" style="display:none" id="file-input">
    </label>
  </div>
  <div class="scroll">
    <div id="lib-form-wrap"></div>
    <div id="my-lists"></div>
    <div class="sec-head">Available packs</div>
    <div class="pack-grid" id="pack-grid"></div>
    <div style="margin-top:28px;padding-top:18px;border-top:1px solid var(--bdr);text-align:center">
      <button class="btn" id="clear-btn" style="font-size:12px;color:var(--tx3)">🗑 Clear all app data</button>
      <p style="font-size:11px;color:var(--tx3);margin-top:7px">Removes all ratings & imported lists. Use if the app gets stuck.</p>
    </div>
  </div>
</div>

<!-- LIST SCREEN -->
<div class="screen" id="scr-list">
  <div class="topbar">
    <button class="tbk" id="back-btn">← Lists</button>
    <div style="flex:1;min-width:0">
      <div class="topbar-title" id="list-title"></div>
    </div>
    <button class="tbk sm" id="list-edit-btn">✏ Edit</button>
  </div>
  <div class="prog-bar">
    <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <span class="prog-lbl" id="prog-lbl">0 / 0</span>
  </div>
  <div class="list-tabs">
    <button class="ltab on" id="ltab-rate"    data-tab="rate">Rate</button>
    <button class="ltab"    id="ltab-results" data-tab="results">Results</button>
    <button class="ltab"    id="ltab-manage"  data-tab="manage">Items</button>
  </div>

  <!-- Edit form (shown inside list screen) -->
  <div id="list-edit-form" style="display:none;padding:16px;background:var(--sur);border-bottom:1px solid var(--bdr)">
    <div class="list-form" style="margin-bottom:0">
      <h3>Edit list details</h3>
      <div class="form-row">
        <input class="form-emoji" id="edit-emoji" placeholder="📋" maxlength="4">
        <input class="form-inp" id="edit-name" placeholder="List name*" maxlength="60">
      </div>
      <input class="form-inp" id="edit-sub" placeholder="Short description (optional)" maxlength="80" style="width:100%;margin-bottom:8px">
      <div class="form-err" id="edit-err"></div>
      <div class="form-btns">
        <button class="form-btn p" id="edit-save-btn">Save changes</button>
        <button class="form-btn" id="edit-cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

  <div class="scroll" id="tab-rate">
    <div id="tier-rows"></div>
    <div id="now-box"></div>
    <div id="pool"></div>
  </div>
  <div class="scroll" id="tab-results" style="display:none">
    <div id="res-rows"></div>
    <div id="res-unrated"></div>
    <div class="save-box">
      <h3>Save your rankings</h3>
      <p>Copy the text below to keep a record.</p>
      <textarea id="save-txt" readonly></textarea>
      <div class="btn-row">
        <button class="btn" id="copy-btn">📋 Copy</button>
        <button class="btn" id="reset-btn">↺ Reset ratings</button>
      </div>
    </div>
  </div>
  <div class="scroll" id="tab-manage" style="display:none">
    <div class="mcard">
      <h3>Add an item</h3>
      <div class="add-row">
        <input class="add-inp" id="add-inp" type="text" placeholder="Enter a name…" maxlength="80">
        <button class="add-go" id="add-btn">Add</button>
      </div>
      <div class="add-err" id="add-err"></div>
    </div>
    <div class="mcard">
      <h3>All items</h3>
      <div id="fl-list"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

const TIERS=[{id:'S',l:'S',s:'legendary'},{id:'A',l:'A',s:'so good'},{id:'B',l:'B',s:'solid'},{id:'C',l:'C',s:"it's fine"},{id:'D',l:'D',s:"i'd pass"},{id:'F',l:'F',s:'never again'}];
const TLABELS={S:'Legendary',A:'So Good',B:'Solid Choice',C:"It's Fine",D:"I'd Pass",F:'Never Again'};
const COL={S:{bg:'var(--s-bg)',bd:'var(--s-bd)',tx:'var(--s-tx)'},A:{bg:'var(--a-bg)',bd:'var(--a-bd)',tx:'var(--a-tx)'},B:{bg:'var(--b-bg)',bd:'var(--b-bd)',tx:'var(--b-tx)'},C:{bg:'var(--c-bg)',bd:'var(--c-bd)',tx:'var(--c-tx)'},D:{bg:'var(--d-bg)',bd:'var(--d-bd)',tx:'var(--d-tx)'},F:{bg:'var(--f-bg)',bd:'var(--f-bd)',tx:'var(--f-tx)'}};

/* ── STORAGE ─────────────────────────────────────── */
const S={
  get(k,fb){try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):fb}catch{return fb}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};

/* ── APP STATE ───────────────────────────────────── */
let myIds    = S.get('tla2_ids',[]);
let imported = S.get('tla2_imp',{});
let activeId = null;
let listTab  = 'rate';
let libForm  = null; // 'create' | null

/* ── LIST HELPERS ────────────────────────────────── */
function getList(id){
  const base = PACKS.find(p=>p.id===id) || imported[id] || null;
  if(!base) return null;
  const meta = S.get('tla2_meta_'+id, null);
  return meta ? {...base, name:meta.name||base.name, emoji:meta.emoji||base.emoji, sub:meta.sub||base.sub} : base;
}
function getItems(id){ const l=getList(id); return l?[...l.items,...S.get('tla2_cust_'+id,[])]:[]; }
function getRatings(id){ return S.get('tla2_rat_'+id,{S:[],A:[],B:[],C:[],D:[],F:[]}); }
function saveRatings(id,r){ S.set('tla2_rat_'+id,r); }
function getCustom(id){ return S.get('tla2_cust_'+id,[]); }
function saveCustom(id,c){ S.set('tla2_cust_'+id,c); }
function getSel(id){ return S.get('tla2_sel_'+id,null); }
function setSel(id,v){ S.set('tla2_sel_'+id,v); }
function getRated(r){ return new Set(Object.values(r).flat()); }
function getUnrated(id){ const all=getItems(id),rat=getRated(getRatings(id)); return all.filter(f=>!rat.has(f)); }
function getTierOf(id,f){ return TIERS.find(t=>getRatings(id)[t.id].includes(f))?.id||null; }
function ensureSel(id){ const u=getUnrated(id); if(u.length&&!u.includes(getSel(id))) setSel(id,u[0]); }

/* ── NAVIGATION ──────────────────────────────────── */
function showLib(){
  activeId=null; libForm=null;
  document.getElementById('scr-list').classList.remove('on');
  document.getElementById('scr-lib').classList.add('on');
  renderLib();
}

function showList(id,tab){
  activeId=id; listTab=tab||'rate'; libForm=null;
  ensureSel(id);
  document.getElementById('scr-lib').classList.remove('on');
  document.getElementById('scr-list').classList.add('on');
  const list=getList(id);
  document.getElementById('list-title').textContent=(list?.emoji||'')+' '+(list?.name||'');
  document.getElementById('list-edit-form').style.display='none';
  setTab(listTab);
}

function setTab(tab){
  listTab=tab;
  ['rate','results','manage'].forEach(t=>{
    document.getElementById('ltab-'+t).classList.toggle('on',t===tab);
    document.getElementById('tab-'+t).style.display=t===tab?'':'none';
  });
  if(tab==='rate') renderRate();
  else if(tab==='results') renderResults();
  else renderManage();
  updateProg();
}

function updateProg(){
  if(!activeId) return;
  const all=getItems(activeId), rat=getRated(getRatings(activeId)).size;
  const pct=all.length?Math.round(rat/all.length*100):0;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-lbl').textContent=rat+' / '+all.length;
}

/* ── LIBRARY RENDER ──────────────────────────────── */
function renderLib(){
  // Create form
  const fw=document.getElementById('lib-form-wrap');
  if(libForm==='create'){
    fw.innerHTML=`<div class="list-form">
      <h3>Create a new list</h3>
      <div class="form-row">
        <input class="form-emoji" id="form-emoji" placeholder="📋" maxlength="4" value="">
        <input class="form-inp" id="form-name" placeholder="List name (required)" maxlength="60">
      </div>
      <input class="form-inp" id="form-sub" placeholder="Short description (optional)" maxlength="80" style="width:100%;margin-bottom:8px">
      <div class="form-err" id="form-err"></div>
      <div class="form-btns">
        <button class="form-btn p" id="form-create-btn">Create list →</button>
        <button class="form-btn" id="form-cancel-btn">Cancel</button>
      </div>
    </div>`;
    document.getElementById('form-create-btn').addEventListener('click', submitCreate);
    document.getElementById('form-cancel-btn').addEventListener('click', ()=>{ libForm=null; renderLib(); });
    setTimeout(()=>document.getElementById('form-name')?.focus(), 50);
  } else {
    fw.innerHTML='';
  }

  // My lists
  const el=document.getElementById('my-lists');
  if(!myIds.length){
    el.innerHTML=`<div style="margin-bottom:24px"><div class="sec-head">My lists</div><div class="empty-state"><p>No lists yet. Create one or add a built-in pack below.</p></div></div>`;
  } else {
    el.innerHTML=`<div style="margin-bottom:24px"><div class="sec-head">My lists (${myIds.length})</div><div class="pack-grid">${myIds.map(listCard).join('')}</div></div>`;
  }

  // Available packs
  const notAdded=PACKS.filter(p=>!myIds.includes(p.id));
  const pg=document.getElementById('pack-grid');
  pg.innerHTML=notAdded.length===0
    ?'<p style="font-size:13px;color:var(--tx3)">All built-in packs are in your library!</p>'
    :notAdded.map(p=>`<div class="card">
        <div class="card-top"><div class="card-emoji">${p.emoji}</div><div><div class="card-name">${p.name}</div><div class="card-sub">${p.sub}</div></div></div>
        <div class="card-btns"><button class="cbtn" data-add="${p.id}">+ Add to my lists</button></div>
      </div>`).join('');
}

function listCard(id){
  const l=getList(id); if(!l) return '';
  const all=getItems(id),r=getRatings(id),rat=getRated(r).size,pct=all.length?Math.round(rat/all.length*100):0;
  return `<div class="card">
    <div class="card-top"><div class="card-emoji">${l.emoji||'📋'}</div><div><div class="card-name">${l.name}</div><div class="card-sub">${l.sub||all.length+' items'}</div></div></div>
    <div><div class="card-prog-track"><div class="card-prog-fill" style="width:${pct}%"></div></div><div class="card-prog-lbl">${rat} / ${all.length} rated${pct===100?' · Complete! 🎉':''}</div></div>
    <div class="card-btns">
      <button class="cbtn p" data-open="${id}" data-tab="rate">Rate →</button>
      <button class="cbtn" data-open="${id}" data-tab="results">Results</button>
      <button class="cbtn" data-edit="${id}">✏ Edit</button>
      <button class="cbtn d" data-remove="${id}">Remove</button>
    </div>
  </div>`;
}

/* ── CREATE LIST ─────────────────────────────────── */
function submitCreate(){
  const name=(document.getElementById('form-name')?.value||'').trim();
  const emoji=(document.getElementById('form-emoji')?.value||'').trim()||'📋';
  const sub=(document.getElementById('form-sub')?.value||'').trim();
  const errEl=document.getElementById('form-err');
  if(!name){ if(errEl) errEl.textContent='Name is required.'; return; }
  const id='custom_'+Date.now();
  imported[id]={id,name,emoji,sub:sub||name,items:[]};
  S.set('tla2_imp',imported);
  myIds.push(id); S.set('tla2_ids',myIds);
  libForm=null;
  toast('✓ "'+name+'" created — add items in the Items tab');
  showList(id,'manage');
}

/* ── EDIT LIST META ──────────────────────────────── */
function openEditForm(id){
  const list=getList(id); if(!list) return;
  const form=document.getElementById('list-edit-form');
  form.style.display='';
  document.getElementById('edit-emoji').value=list.emoji||'';
  document.getElementById('edit-name').value=list.name||'';
  document.getElementById('edit-sub').value=list.sub||'';
  document.getElementById('edit-err').textContent='';
  document.getElementById('edit-name').focus();
}

function saveEdit(){
  const id=activeId; if(!id) return;
  const name=(document.getElementById('edit-name')?.value||'').trim();
  const emoji=(document.getElementById('edit-emoji')?.value||'').trim()||'📋';
  const sub=(document.getElementById('edit-sub')?.value||'').trim();
  const errEl=document.getElementById('edit-err');
  if(!name){ if(errEl) errEl.textContent='Name is required.'; return; }
  S.set('tla2_meta_'+id,{name,emoji,sub});
  if(imported[id]){ imported[id]={...imported[id],name,emoji,sub}; S.set('tla2_imp',imported); }
  document.getElementById('list-edit-form').style.display='none';
  document.getElementById('list-title').textContent=emoji+' '+name;
  toast('✓ List updated');
}

/* ── LIBRARY ACTIONS ─────────────────────────────── */
function removePack(id){
  const l=getList(id);
  if(!confirm('Remove "'+( l?.name||'this list')+'" from your library?')) return;
  myIds=myIds.filter(x=>x!==id); S.set('tla2_ids',myIds); renderLib();
}

/* ── IMPORT ──────────────────────────────────────── */
document.getElementById('file-input').addEventListener('change',function(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const d=JSON.parse(ev.target.result);
      if(!d.items||!Array.isArray(d.items)||!d.items.length) return toast('Invalid file — needs an "items" array');
      const id=d.id||'imp_'+Date.now();
      const pack={id,name:d.name||'Imported List',emoji:d.emoji||'📋',sub:d.subtitle||d.items.length+' items',items:d.items.map(i=>typeof i==='string'?i:(i.name||String(i))).filter(Boolean)};
      imported[id]=pack; S.set('tla2_imp',imported);
      if(!myIds.includes(id)){ myIds.push(id); S.set('tla2_ids',myIds); }
      toast('✓ "'+pack.name+'" added to your library');
      renderLib();
    }catch(err){ toast("Could not read that file — check it's valid JSON"); }
  };
  reader.readAsText(file);
  e.target.value='';
});

/* ── RATE RENDER ─────────────────────────────────── */
function renderRate(){
  const id=activeId; if(!id) return;
  ensureSel(id);
  const rat=getRatings(id), sel=getSel(id), cust=new Set(getCustom(id));
  document.getElementById('tier-rows').innerHTML=TIERS.map(t=>{
    const c=COL[t.id];
    const chips=rat[t.id].map(f=>`<span class="rchip" style="background:${c.bg};border-color:${c.bd};color:${c.tx}"><span class="rchip-name" data-rerate="${esc(f)}">${f}</span><button class="rchip-del" data-unrate="${esc(f)}">×</button></span>`).join('');
    return `<div class="tier-row"><button class="tier-btn" data-assign="${t.id}" ${!sel?'disabled':''} style="background:${c.bg};border-color:${c.bd}"><span class="tletter" style="color:${c.tx}">${t.l}</span><span class="tsub" style="color:${c.tx}">${t.s}</span></button><div class="tier-drop">${chips}</div></div>`;
  }).join('');

  const nowEl=document.getElementById('now-box');
  if(sel){
    const badge=cust.has(sel)?`<span style="font-size:9px;font-weight:600;padding:2px 5px;background:var(--b-bg);color:var(--b-tx);border-radius:4px;margin-left:6px">custom</span>`:'';
    nowEl.innerHTML=`<div class="now-box"><span class="now-lbl">Now rating</span><span class="now-name">${sel}${badge}</span><span class="now-hint">← tap a tier</span></div>`;
  } else { nowEl.innerHTML=''; }

  const poolEl=document.getElementById('pool');
  const unrated=getUnrated(id);
  if(!unrated.length){
    poolEl.innerHTML=`<div class="done-box"><p>🎉 All ${getItems(id).length} items rated!</p><button class="btn p" data-tab="results">See my full tier list →</button></div>`;
    return;
  }
  const pchips=unrated.map(f=>`<button class="pchip${f===sel?' sel':cust.has(f)?' cust':''}" data-sel="${esc(f)}">${f}${cust.has(f)&&f!==sel?' ✦':''}</button>`).join('');
  poolEl.innerHTML=`<div class="pool-lbl">Unrated (${unrated.length} left) — select an item, then tap a tier</div><div class="pool">${pchips}</div>${getRated(rat).size>0?'<div class="btn-row"><button class="btn" data-tab="results">Preview results →</button></div>':''}`;
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

/* ── RESULTS RENDER ──────────────────────────────── */
function renderResults(){
  const id=activeId; if(!id) return;
  const rat=getRatings(id), unrated=getUnrated(id);
  const active=TIERS.filter(t=>rat[t.id].length>0);
  document.getElementById('res-rows').innerHTML=active.length===0
    ?'<p style="color:var(--tx2);font-size:14px;padding:16px 0">No ratings yet — head to the Rate tab!</p>'
    :active.map(t=>{const c=COL[t.id];return `<div class="res-row"><div class="res-tier" style="background:${c.bg}"><span class="res-letter" style="color:${c.tx}">${t.l}</span><span class="res-sub" style="color:${c.tx}">${t.s}</span></div><div class="res-chips">${rat[t.id].map(f=>`<span class="res-chip" style="background:${c.bg};color:${c.tx}">${f}</span>`).join('')}</div></div>`;}).join('');
  document.getElementById('res-unrated').innerHTML=unrated.length?`<div class="unrated-note">⚠ ${unrated.length} unrated: ${unrated.join(', ')}</div>`:'';
  const lines=[`🏆 ${getList(id)?.name} — My Tier List`,''];
  TIERS.forEach(t=>{if(rat[t.id].length){lines.push(`[ ${t.l} — ${TLABELS[t.id]} ]`);rat[t.id].forEach(f=>lines.push('  • '+f));lines.push('');}});
  if(unrated.length) lines.push('Unrated: '+unrated.join(', '));
  document.getElementById('save-txt').value=lines.join('\n');
}

/* ── MANAGE RENDER ───────────────────────────────── */
function renderManage(){
  const id=activeId; if(!id) return;
  const all=getItems(id), cust=getCustom(id), custSet=new Set(cust);
  const row=f=>{const tid=getTierOf(id,f),isCust=custSet.has(f);return `<div class="fl-item"><span class="fl-name">${f}</span>${isCust?'<span class="pill pill-c">custom</span>':''}${tid?`<span class="pill pill-r">rated ${tid}</span>`:''}<button class="rm-btn" data-rm="${esc(f)}">×</button></div>`;};
  const customs=all.filter(f=>custSet.has(f)), defs=all.filter(f=>!custSet.has(f));
  let html='';
  if(customs.length){ html+=`<div class="sec-lbl">Custom (${customs.length})</div>`+customs.map(row).join('')+'<div class="divider"></div>'; }
  if(defs.length){ html+=`<div class="sec-lbl">${PACKS.find(p=>p.id===id)?'From pack':'Base items'} (${defs.length})</div>`+defs.map(row).join(''); }
  if(!all.length){ html='<p style="font-size:13px;color:var(--tx3);padding:8px 0">No items yet — add some above!</p>'; }
  document.getElementById('fl-list').innerHTML=`<div class="fl-list">${html}</div>`;
}

/* ── RATING ACTIONS ──────────────────────────────── */
function assign(tierId){
  const id=activeId, sel=getSel(id); if(!sel) return;
  const r=getRatings(id);
  TIERS.forEach(t=>{r[t.id]=r[t.id].filter(x=>x!==sel);});
  r[tierId].push(sel); saveRatings(id,r);
  const u=getUnrated(id); setSel(id,u[0]||null);
  renderRate(); updateProg();
}

function reRate(f){
  const id=activeId, r=getRatings(id);
  TIERS.forEach(t=>{r[t.id]=r[t.id].filter(x=>x!==f);});
  saveRatings(id,r); setSel(id,f); setTab('rate');
}

function unRate(f){
  const id=activeId, r=getRatings(id);
  TIERS.forEach(t=>{r[t.id]=r[t.id].filter(x=>x!==f);});
  saveRatings(id,r); if(!getSel(id)) setSel(id,f);
  renderRate(); updateProg();
}

function selItem(f){ setSel(activeId,f); renderRate(); }

function resetRatings(){
  if(!confirm('Clear all ratings for this list? Items stay the same.')) return;
  const id=activeId;
  saveRatings(id,{S:[],A:[],B:[],C:[],D:[],F:[]});
  setSel(id,getItems(id)[0]||null);
  setTab('rate');
}

function addItem(){
  const id=activeId, inp=document.getElementById('add-inp'), err=document.getElementById('add-err');
  const name=inp.value.trim(); err.textContent='';
  if(!name){err.textContent='Please enter a name.';return;}
  if(getItems(id).some(f=>f.toLowerCase()===name.toLowerCase())){err.textContent=`"${name}" is already in the list.`;return;}
  const c=getCustom(id); c.push(name); saveCustom(id,c);
  if(!getSel(id)) setSel(id,name);
  inp.value=''; renderManage(); updateProg();
}

function removeItem(f){
  const id=activeId, tid=getTierOf(id,f);
  if(tid&&!confirm(`"${f}" is rated ${tid}. Remove it anyway?`)) return;
  const c=getCustom(id).filter(x=>x!==f); saveCustom(id,c);
  const r=getRatings(id); TIERS.forEach(t=>{r[t.id]=r[t.id].filter(x=>x!==f);}); saveRatings(id,r);
  if(getSel(id)===f){const u=getUnrated(id).filter(x=>x!==f);setSel(id,u[0]||null);}
  renderManage(); updateProg();
}

function clearAll(){
  if(!confirm('Delete ALL ratings and imported lists? Cannot be undone.')) return;
  try{localStorage.clear();}catch(e){}
  myIds=[]; imported=[]; activeId=null; libForm=null;
  showLib(); toast('All data cleared — fresh start!');
}

/* ── EVENT DELEGATION ────────────────────────────── */
// Library screen
document.getElementById('scr-lib').addEventListener('click', function(e){
  const t=e.target.closest('[data-add],[data-open],[data-edit],[data-remove]');
  if(!t) return;
  if(t.dataset.add){ if(!myIds.includes(t.dataset.add)){myIds.push(t.dataset.add);S.set('tla2_ids',myIds);}renderLib();}
  else if(t.dataset.open){ showList(t.dataset.open, t.dataset.tab||'rate'); }
  else if(t.dataset.edit){ showList(t.dataset.edit,'rate'); setTimeout(()=>openEditForm(t.dataset.edit),50); }
  else if(t.dataset.remove){ removePack(t.dataset.remove); }
});

document.getElementById('new-list-btn').addEventListener('click',()=>{ libForm='create'; renderLib(); });

// List screen
document.getElementById('scr-list').addEventListener('click',function(e){
  const t=e.target;
  const ltab=t.closest('[data-tab]'); if(ltab){setTab(ltab.dataset.tab);return;}
  const tbtn=t.closest('[data-assign]'); if(tbtn&&!tbtn.disabled){assign(tbtn.dataset.assign);return;}
  if(t.dataset.rerate!==undefined){reRate(t.dataset.rerate);return;}
  if(t.dataset.unrate!==undefined){unRate(t.dataset.unrate);return;}
  if(t.dataset.sel!==undefined){selItem(t.dataset.sel);return;}
  if(t.dataset.rm!==undefined){removeItem(t.dataset.rm);return;}
});

document.getElementById('back-btn').addEventListener('click',showLib);
document.getElementById('list-edit-btn').addEventListener('click',()=>openEditForm(activeId));
document.getElementById('edit-save-btn').addEventListener('click',saveEdit);
document.getElementById('edit-cancel-btn').addEventListener('click',()=>{ document.getElementById('list-edit-form').style.display='none'; });
document.getElementById('reset-btn').addEventListener('click',resetRatings);
document.getElementById('clear-btn').addEventListener('click',clearAll);
document.getElementById('copy-btn').addEventListener('click',function(){
  const ta=document.getElementById('save-txt'); ta.select(); document.execCommand('copy');
  const orig=this.textContent; this.textContent='✓ Copied!'; setTimeout(()=>this.textContent=orig,1800);
});
document.getElementById('add-btn').addEventListener('click',addItem);
document.getElementById('add-inp').addEventListener('keydown',function(e){if(e.key==='Enter')addItem();});

/* ── TOAST ───────────────────────────────────────── */
let toastT;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),3200);}

/* ── INIT ────────────────────────────────────────── */
renderLib();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js'); });
}
</script>
</body>
